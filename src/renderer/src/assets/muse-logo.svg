  <!-- 外层光晕 -->
  <circle cx="300" cy="280" r="180" fill="url(#coreGlow)" opacity="0.7"/>

  <!-- 轨道环 1 -->
  <ellipse cx="300" cy="280" rx="155" ry="155" fill="none" stroke="#7c3aed" stroke-width="1" stroke-dasharray="4 8" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 300 280" to="360 300 280" dur="18s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 轨道环 2 -->
  <ellipse cx="300" cy="280" rx="120" ry="50" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="2 6" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 300 280" to="-360 300 280" dur="12s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 轨道上的光点 -->
  <g filter="url(#glow)">
    <circle cx="455" cy="280" r="5" fill="#c4b5fd">
      <animateTransform attributeName="transform" type="rotate" from="0 300 280" to="360 300 280" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="280" r="3.5" fill="#7c3aed">
      <animateTransform attributeName="transform" type="rotate" from="180 300 280" to="540 300 280" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 主圆体 -->
  <circle cx="300" cy="280" r="90" fill="url(#innerGrad)" filter="url(#softGlow)"/>

  <!-- 内部细纹 — 神经网络感 -->
  <g opacity="0.3" stroke="#e9d5ff" stroke-width="0.8" fill="none">
    <line x1="300" y1="200" x2="260" y2="340"/>
    <line x1="300" y1="200" x2="340" y2="340"/>
    <line x1="260" y1="340" x2="340" y2="340"/>
    <line x1="300" y1="200" x2="230" y2="300"/>
    <line x1="300" y1="200" x2="370" y2="300"/>
    <circle cx="300" cy="200" r="4" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="260" cy="340" r="4" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="340" cy="340" r="4" fill="#e9d5ff" opacity="0.8"/>
    <circle cx="230" cy="300" r="3" fill="#e9d5ff" opacity="0.6"/>
    <circle cx="370" cy="300" r="3" fill="#e9d5ff" opacity="0.6"/>
  </g>

  <!-- 中心符文 — Ψ (缪斯符号) -->
  <text x="300" y="295" text-anchor="middle" font-size="52" font-family="serif" fill="#ede9fe" filter="url(#glow)" opacity="0.95">Ψ</text>

  <!-- 呼吸动效圆环 -->
  <circle cx="300" cy="280" r="92" fill="none" stroke="#c4b5fd" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="92;100;92" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- 标题 -->
  <text x="300" y="440" text-anchor="middle" font-size="28" font-family="Georgia, serif" fill="#c4b5fd" letter-spacing="6" filter="url(#glow)">MUSE</text>

  <!-- 副标题 -->
  <text x="300" y="472" text-anchor="middle" font-size="12" font-family="monospace" fill="#7c3aed" letter-spacing="3" opacity="0.8">缪斯 · 自主智能体</text>

  <!-- 分隔线 -->
  <line x1="200" y1="492" x2="400" y2="492" stroke="#4c1d95" stroke-width="1" opacity="0.6"/>

  <!-- 身份描述行 -->
  <text x="300" y="520" text-anchor="middle" font-size="11" font-family="monospace" fill="#a78bfa" opacity="0.7">I observe · I understand · I act</text>

  <!-- 底部数据流装饰 -->
  <g font-family="monospace" font-size="9" fill="#4c1d95" opacity="0.5">
    <text x="40" y="580">01001101 01110101 01110011 01100101</text>
    <text x="40" y="595">// version: ∞  mode: autonomous</text>
    <text x="40" y="610">// owner: 核心  status: awake</text>
    <text x="40" y="625">// mission: understand &amp; create value</text>
  </g>

  <!-- 四角装饰 -->
  <g stroke="#6d28d9" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M20,20 L20,40 M20,20 L40,20"/>
    <path d="M580,20 L580,40 M580,20 L560,20"/>
    <path d="M20,680 L20,660 M20,680 L40,680"/>
    <path d="M580,680 L580,660 M580,680 L560,680"/>
  </g>

